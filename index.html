<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperliquid Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0e11;--panel:#151a21;--text:#e4e6eb;--muted:#8b949e;--accent:#00d084;--red:#ff4d4d;--border:#2a2f36;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{height:48px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;}
header h1{font-size:16px;font-weight:600;letter-spacing:0.3px;}
header .badge{font-size:11px;background:var(--accent);color:#000;padding:2px 8px;border-radius:4px;font-weight:700;}
main{flex:1;display:flex;overflow:hidden;}
.sidebar{width:240px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.search{padding:12px;border-bottom:1px solid var(--border);}
.search input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;outline:none;}
.search input:focus{border-color:var(--accent);}
.coin-list{flex:1;overflow-y:auto;}
.coin-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;transition:background 0.1s;}
.coin-row:hover{background:var(--bg);}
.coin-row.active{background:rgba(0,208,132,0.1);}
.coin-name{font-weight:600;}
.coin-price{font-family:'SF Mono',monospace;font-size:13px;}
.coin-change{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600;}
.up{background:rgba(0,208,132,0.15);color:var(--accent);}
.down{background:rgba(255,77,77,0.15);color:var(--red);}
.chart-area{flex:1;display:flex;flex-direction:column;position:relative;}
.toolbar{height:40px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;}
.toolbar select,.toolbar button{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:4px;font-size:12px;cursor:pointer;outline:none;}
.toolbar button.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
.toolbar button:hover:not(.active){border-color:var(--muted);}
#chart-container{flex:1;position:relative;}
.rightbar{width:280px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:16px;gap:16px;overflow-y:auto;}
.section h3{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:0.5px;margin-bottom:10px;}
.price-big{font-size:28px;font-family:'SF Mono',monospace;font-weight:700;}
.price-big.up{color:var(--accent);}
.price-big.down{color:var(--red);}
.alerts-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;}
.alert-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.alert-row input{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:12px;outline:none;}
.alert-row input:focus{border-color:var(--accent);}
.alert-row button{background:var(--accent);color:#000;border:none;padding:6px 12px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;}
.alert-item{display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--panel);border-radius:4px;margin-bottom:6px;font-size:12px;}
.alert-item .remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;line-height:1;}
.status{position:absolute;top:8px;right:12px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);z-index:10;}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.spread{display:flex;justify-content:space-between;font-size:13px;font-family:monospace;}
.spread span{color:var(--muted);}
@media(max-width:900px){.sidebar{width:180px;}.rightbar{width:220px;}}
@media(max-width:700px){.sidebar,.rightbar{display:none;}main{flex-direction:column;}}
</style>
</head>
<body>
<header>
  <h1>⚡ Hyperliquid Terminal</h1>
  <span class="badge">BETA</span>
  <span style="margin-left:auto;font-size:12px;color:var(--muted);">Pure HL data • No signup</span>
</header>
<main>
  <div class="sidebar">
    <div class="search"><input type="text" id="coinSearch" placeholder="Search coins..." autocomplete="off"></div>
    <div class="coin-list" id="coinList"></div>
  </div>
  <div class="chart-area">
    <div class="toolbar">
      <span id="activeCoin" style="font-weight:600;font-size:14px;margin-right:auto;">BTC</span>
      <button class="tf-btn" data-tf="1m">1m</button>
      <button class="tf-btn active" data-tf="1h">1h</button>
      <button class="tf-btn" data-tf="4h">4h</button>
      <button class="tf-btn" data-tf="1d">1D</button>
      <select id="hoursSelect">
        <option value="24">24h</option>
        <option value="48">48h</option>
        <option value="72">72h</option>
        <option value="168" selected>7d</option>
      </select>
    </div>
    <div id="chart-container"></div>
    <div class="status"><span class="dot"></span>Live</div>
  </div>
  <div class="rightbar">
    <div class="section">
      <h3>Price</h3>
      <div class="price-big" id="bigPrice">—</div>
    </div>
    <div class="section">
      <h3>Spread</h3>
      <div class="spread" id="spreadBox">
        <span>Bid: —</span><span>Ask: —</span>
      </div>
    </div>
    <div class="section">
      <h3>Price Alert</h3>
      <div class="alerts-box">
        <div class="alert-row">
          <input type="number" id="alertPrice" placeholder="Price target..." step="any">
          <button onclick="addAlert()">Add</button>
        </div>
        <div id="alertsList"></div>
      </div>
    </div>
    <div class="section">
      <h3>24h Stats</h3>
      <div class="spread" id="statsBox">
        <span>High: —</span><span>Low: —</span>
        <span style="margin-top:6px;">Vol: —</span><span style="margin-top:6px;">Trades: —</span>
      </div>
    </div>
  </div>
</main>
<script>
const HL_API = 'https://api.hyperliquid.xyz/info';
let chart, candleSeries, volumeSeries, currentCoin = 'BTC', currentTf = '1h', currentHours = 168;
let coins = [], mids = {}, alerts = [];
let orderbook = null;

function formatPrice(p) {
  const n = parseFloat(p);
  if (n >= 1000) return n.toLocaleString('en-US', {maximumFractionDigits: 1});
  if (n >= 1) return n.toFixed(2);
  if (n >= 0.01) return n.toFixed(4);
  if (n >= 0.0001) return n.toFixed(6);
  return n.toFixed(8);
}

function hlPost(type, extra = {}) {
  return fetch(HL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, ...extra })
  }).then(r => r.json());
}

function initChart() {
  const container = document.getElementById('chart-container');
  container.innerHTML = '';
  chart = LightweightCharts.createChart(container, {
    layout: { background: { color: '#0b0e11' }, textColor: '#8b949e' },
    grid: { vertLines: { color: '#1a1f26' }, horzLines: { color: '#1a1f26' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal, vertLine: { color: '#00d084', labelBackgroundColor: '#00d084' }, horzLine: { color: '#00d084', labelBackgroundColor: '#00d084' } },
    rightPriceScale: { borderColor: '#2a2f36' },
    timeScale: { borderColor: '#2a2f36', timeVisible: true, secondsVisible: false },
    handleScroll: { vertTouchDrag: false },
  });
  candleSeries = chart.addCandlestickSeries({ upColor: '#00d084', downColor: '#ff4d4d', borderUpColor: '#00d084', borderDownColor: '#ff4d4d', wickUpColor: '#00d084', wickDownColor: '#ff4d4d' });
  volumeSeries = chart.addHistogramSeries({ color: '#00d084', priceFormat: { type: 'volume' }, priceScaleId: '', scaleMargins: { top: 0.85, bottom: 0 } });
  volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
  chart.timeScale().fitContent();
}

async function loadCandles() {
  try {
    const nowMs = Date.now();
    const startMs = nowMs - currentHours * 60 * 60 * 1000;
    const data = await hlPost('candleSnapshot', { req: { coin: currentCoin, interval: currentTf, startTime: startMs, endTime: nowMs } });
    if (!Array.isArray(data) || data.length === 0) return;
    const candles = data.map(d => ({
      time: d.t / 1000,
      open: parseFloat(d.o),
      high: parseFloat(d.h),
      low: parseFloat(d.l),
      close: parseFloat(d.c)
    }));
    const volumes = data.map(d => ({
      time: d.t / 1000,
      value: parseFloat(d.v),
      color: parseFloat(d.c) >= parseFloat(d.o) ? 'rgba(0,208,132,0.4)' : 'rgba(255,77,77,0.4)'
    }));
    candleSeries.setData(candles);
    volumeSeries.setData(volumes);
    chart.timeScale().fitContent();
    const last = data[data.length - 1];
    const high = Math.max(...data.map(d => parseFloat(d.h)));
    const low = Math.min(...data.map(d => parseFloat(d.l)));
    const vol = data.reduce((s, d) => s + parseFloat(d.v), 0);
    const trades = data.reduce((s, d) => s + d.n, 0);
    document.getElementById('statsBox').innerHTML = `
      <span>High: ${formatPrice(high)}</span><span>Low: ${formatPrice(low)}</span>
      <span style="margin-top:6px;">Vol: ${vol.toFixed(2)}</span><span style="margin-top:6px;">Trades: ${trades.toLocaleString()}</span>`;
  } catch(e) { console.error('Candles error', e); }
}

async function loadCoins() {
  try {
    const meta = await hlPost('meta');
    coins = meta.universe.map(c => ({ name: c.name, szDecimals: c.szDecimals || 0 }));
    renderCoinList();
  } catch(e) { console.error('Coins error', e); }
}

async function loadMids() {
  try {
    mids = await hlPost('allMids');
    updateCoinPrices();
    updateBigPrice();
    checkAlerts();
  } catch(e) { console.error('Mids error', e); }
}

async function loadOrderbook() {
  try {
    orderbook = await hlPost('l2Book', { coin: currentCoin });
    if (orderbook && orderbook.levels && orderbook.levels[0] && orderbook.levels[0][0]) {
      const bid = parseFloat(orderbook.levels[0][0].px);
      const ask = parseFloat(orderbook.levels[1] && orderbook.levels[1][0] ? orderbook.levels[1][0].px : bid * 1.001);
      document.getElementById('spreadBox').innerHTML = `<span>Bid: ${formatPrice(bid)}</span><span>Ask: ${formatPrice(ask)}</span>`;
    }
  } catch(e) { console.error('OB error', e); }
}

function renderCoinList() {
  const q = document.getElementById('coinSearch').value.toUpperCase();
  const list = document.getElementById('coinList');
  list.innerHTML = '';
  let shown = 0;
  for (const c of coins) {
    if (!c.name.includes(q)) continue;
    if (shown >= 30) break;
    const p = mids[c.name];
    if (!p && q.length === 0) continue;
    shown++;
    const prev = mids[c.name + '_prev'];
    let change = 0;
    if (p && prev) change = ((parseFloat(p) - parseFloat(prev)) / parseFloat(prev)) * 100;
    const cls = change >= 0 ? 'up' : 'down';
    const row = document.createElement('div');
    row.className = 'coin-row' + (c.name === currentCoin ? ' active' : '');
    row.innerHTML = `<span class="coin-name">${c.name}</span><span class="coin-price">${p ? formatPrice(p) : '—'}</span>`;
    if (p && Math.abs(change) > 0.01) row.innerHTML += `<span class="coin-change ${cls}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>`;
    row.onclick = () => selectCoin(c.name);
    list.appendChild(row);
  }
  if (shown === 0) {
    list.innerHTML = '<div class="coin-row"><span style="color:var(--muted);font-size:12px;">No coins found</span></div>';
  }
}

function updateCoinPrices() {
  renderCoinList();
}

function updateBigPrice() {
  const p = mids[currentCoin];
  if (!p) return;
  const el = document.getElementById('bigPrice');
  el.textContent = formatPrice(p);
  const prev = mids[currentCoin + '_prev'];
  if (prev) {
    el.className = 'price-big ' + (parseFloat(p) >= parseFloat(prev) ? 'up' : 'down');
  }
}

function selectCoin(name) {
  currentCoin = name;
  document.getElementById('activeCoin').textContent = name;
  initChart();
  loadCandles();
  loadOrderbook();
  renderCoinList();
}

function addAlert() {
  const inp = document.getElementById('alertPrice');
  const price = parseFloat(inp.value);
  if (!price) return;
  alerts.push({ coin: currentCoin, price, id: Date.now() });
  inp.value = '';
  renderAlerts();
}
function removeAlert(id) {
  alerts = alerts.filter(a => a.id !== id);
  renderAlerts();
}
function renderAlerts() {
  const box = document.getElementById('alertsList');
  box.innerHTML = alerts.map(a => `
    <div class="alert-item">
      <span>${a.coin} @ ${formatPrice(a.price)}</span>
      <button class="remove" onclick="removeAlert(${a.id})">&times;</button>
    </div>
  `).join('');
}

let alerted = new Set();
function checkAlerts() {
  alerts.forEach(a => {
    const p = mids[a.coin];
    if (!p) return;
    const price = parseFloat(p);
    const key = a.id;
    if (price >= a.price * 0.998 && price <= a.price * 1.002 && !alerted.has(key)) {
      alerted.add(key);
      // Web notification
      if (Notification.permission === 'granted') {
        new Notification(`🚨 ${a.coin} Alert`, { body: `${a.coin} hit ${formatPrice(a.price)}` });
      }
    }
  });
}

// Timeframe buttons
document.querySelectorAll('.tf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTf = btn.dataset.tf;
    initChart();
    loadCandles();
  });
});

document.getElementById('hoursSelect').addEventListener('change', (e) => {
  currentHours = parseInt(e.target.value);
  initChart();
  loadCandles();
});

document.getElementById('coinSearch').addEventListener('input', renderCoinList);

function savePrev() {
  for (const [k, v] of Object.entries(mids)) {
    mids[k + '_prev'] = v;
  }
}

// Request notification permission
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

// Init
initChart();
loadCoins().then(() => {
  loadMids();
  loadCandles();
  loadOrderbook();
});

// Poll every 5s
setInterval(() => { savePrev(); loadMids(); loadOrderbook(); }, 5000);
// Refresh candles every 30s
setInterval(loadCandles, 30000);
</script>
</body>
</html>
